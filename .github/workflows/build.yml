name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Android Project
        run: flutter create . --project-name transfer_log --org com.example --platforms android

      - name: Overwrite pubspec.yaml (Fix dependencies)
        run: |
          cat << 'PUBSPEC' > pubspec.yaml
          name: transfer_log
          description: سجل الحوالات
          publish_to: 'none'
          version: 2.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            cupertino_icons: ^1.0.6
            provider: ^6.1.2
            sqflite: ^2.3.2
            path_provider: ^2.1.2
            path: ^1.9.0
            google_fonts: ^6.2.1
            local_auth: ^2.2.0
            pdf: ^3.10.8
            printing: ^5.12.0
            share_plus: ^7.2.2
            file_picker: ^8.0.0
            csv: ^6.0.0
            intl: ^0.18.0
            shared_preferences: ^2.2.2
            fl_chart: ^0.67.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          PUBSPEC

      - name: Inject Android Manifest Permissions
        run: |
          cat << 'MANIFEST' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="سجل الحوالات"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2"/>
              </application>
          </manifest>
          MANIFEST

      - name: Fix MainActivity for Biometrics
        run: |
          cat << 'KT' > android/app/src/main/kotlin/com/example/transfer_log/MainActivity.kt
          package com.example.transfer_log
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()
          KT

      - name: Clean and Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (release, debug signing)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
