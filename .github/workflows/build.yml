name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ✅ الإصدار v4 لا يحاول تثبيت حزمة tools المحذوفة
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Ensure Gradle Wrapper JAR
      run: |
        if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
          -storepass android -keypass android -keyalg RSA -keysize 2048 \
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: transfers-log-apk
        path: app/build/outputs/apk/release/*.apk
